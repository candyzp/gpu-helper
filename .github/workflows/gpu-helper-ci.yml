name: GPU Helper iOS Build and Metal Regression

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-build:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod for iOS
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: given
          target: iOS

      - name: Upload iOS package
        uses: actions/upload-artifact@v4
        with:
          name: GPU-Helper-iOS-v0.3.0
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14

  metal-regression:
    name: Metal Compute Regression
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Metal regression
        run: |
          mkdir -p build
          xcrun --sdk macosx clang++ -std=c++23 -fobjc-arc -Isrc \
            src/gpu/MetalCompute.mm tests/metal_compute_regression.mm \
            -framework Foundation -framework Metal \
            -o build/metal-compute-regression

      - name: Run Metal regression
        run: ./build/metal-compute-regression
